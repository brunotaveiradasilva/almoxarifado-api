# Sobe MySQL + a API localmente com um único comando: docker compose up --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: almoxarifado
      MYSQL_USER: almoxarifado
      MYSQL_PASSWORD: almoxarifado
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/almoxarifado
      DB_USERNAME: almoxarifado
      DB_PASSWORD: almoxarifado
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://brunotaveiradasilva.github.io
      JWT_SECRET: chave-so-para-desenvolvimento-local-nao-use-isto-em-producao
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADS_API_URL: ${ADS_API_URL:-https://adsapi.com.br}
      ADS_API_KEY: ${ADS_API_KEY:-}
      ADS_USER_AGENT: ${ADS_USER_AGENT:-SulBiologic}
      ADS_ESPECIFICO_ID: ${ADS_ESPECIFICO_ID:-074}
      ADS_CNPJ_DISTRIBUIDORA: ${ADS_CNPJ_DISTRIBUIDORA:-}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
